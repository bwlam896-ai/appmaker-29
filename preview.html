<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق الأذكار - Dhikr App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #0f172a;
        }
        .custom-ring {
            transition: stroke-dashoffset 0.3s ease-in-out;
        }
        .btn-press:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-2 sm:p-4">

    <!-- Mobile Frame Simulation -->
    <div class="w-full max-w-md bg-emerald-950 text-slate-100 rounded-[40px] border-[8px] border-slate-800 shadow-2xl overflow-hidden flex flex-col h-[840px] relative">
        
        <!-- Status Bar -->
        <div class="bg-emerald-900/80 px-6 py-2 flex justify-between items-center text-xs text-emerald-200 border-b border-emerald-800/50">
            <span>12:45</span>
            <div class="flex items-center gap-2">
                <i data-lucide="wifi" class="w-3.5 h-3.5"></i>
                <i data-lucide="signal" class="w-3.5 h-3.5"></i>
                <i data-lucide="battery" class="w-4 h-4"></i>
            </div>
        </div>

        <!-- App Header -->
        <div class="bg-emerald-900 p-4 border-b border-emerald-800/60 flex items-center justify-between shadow-lg">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-emerald-700/50 border border-emerald-500/30 flex items-center justify-center text-emerald-300">
                    <i data-lucide="book-open" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-emerald-50">الأذكار والتحصين</h1>
                    <p class="text-xs text-emerald-300">مُسَبِّحَةٌ إلكترونية وتتبع الأذكار</p>
                </div>
            </div>
            <button onclick="openAddModal()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1 shadow-md transition-colors">
                <i data-lucide="plus-circle" class="w-4 h-4"></i>
                إضافة ذكر
            </button>
        </div>

        <!-- Category Tabs -->
        <div class="flex bg-emerald-900/40 p-2 gap-2 border-b border-emerald-800/40 overflow-x-auto text-xs">
            <button onclick="selectCategory('all')" id="tab-all" class="px-3 py-1.5 rounded-full font-bold transition-all bg-emerald-600 text-white whitespace-nowrap">الكل</button>
            <button onclick="selectCategory('morning')" id="tab-morning" class="px-3 py-1.5 rounded-full font-bold transition-all bg-emerald-900/60 text-emerald-300 hover:bg-emerald-800 whitespace-nowrap">أذكار الصباح</button>
            <button onclick="selectCategory('evening')" id="tab-evening" class="px-3 py-1.5 rounded-full font-bold transition-all bg-emerald-900/60 text-emerald-300 hover:bg-emerald-800 whitespace-nowrap">أذكار المساء</button>
            <button onclick="selectCategory('custom')" id="tab-custom" class="px-3 py-1.5 rounded-full font-bold transition-all bg-emerald-900/60 text-emerald-300 hover:bg-emerald-800 whitespace-nowrap">أذكاري المضافة</button>
        </div>

        <!-- Main Display Content -->
        <div class="flex-1 overflow-y-auto p-4 flex flex-col items-center justify-between gap-4">
            
            <!-- Active Dhikr Card -->
            <div class="w-full bg-emerald-900/40 border border-emerald-700/40 rounded-2xl p-4 text-center shadow-inner relative">
                <span id="dhikrCategoryBadge" class="absolute top-3 right-3 text-[10px] bg-emerald-800/80 text-emerald-200 px-2.5 py-0.5 rounded-full font-medium">أذكار عامة</span>
                <p id="dhikrText" class="text-lg font-bold text-amber-200 mt-4 leading-relaxed min-h-[60px] flex items-center justify-center">
                    سُبْحَانَ اللَّهِ وَبِحَمْدِهِ ، سُبْحَانَ اللَّهِ الْعَظِيمِ
                </p>
            </div>

            <!-- Interactive Counter Circle -->
            <div class="relative flex items-center justify-center my-2">
                <svg class="w-56 h-56 transform -rotate-90">
                    <circle cx="112" cy="112" r="96" stroke="currentColor" stroke-width="12" class="text-emerald-950/80" fill="transparent" />
                    <circle id="progressCircle" cx="112" cy="112" r="96" stroke="currentColor" stroke-width="12" class="text-amber-400 custom-ring" fill="transparent" stroke-dasharray="603" stroke-dashoffset="603" stroke-linecap="round" />
                </svg>
                
                <button onclick="incrementCount()" class="absolute w-44 h-44 rounded-full bg-gradient-to-br from-emerald-600 to-emerald-800 hover:from-emerald-500 hover:to-emerald-700 active:scale-95 transition-transform flex flex-col items-center justify-center shadow-xl border-4 border-emerald-400/30 group">
                    <span id="countDisplay" class="text-5xl font-extrabold text-white tracking-wider">0</span>
                    <span id="targetDisplay" class="text-xs text-emerald-200 font-medium mt-1">المستهدف: 33</span>
                    <span class="text-[10px] text-amber-300 opacity-80 group-hover:opacity-100 transition-opacity mt-2 font-bold">اضغط للتسبيح</span>
                </button>
            </div>

            <!-- Quick Action Buttons -->
            <div class="flex gap-3 w-full">
                <button onclick="resetCurrentDhikr()" class="flex-1 bg-emerald-900/60 hover:bg-emerald-800 text-emerald-200 py-2.5 rounded-xl text-xs font-bold border border-emerald-700/50 flex items-center justify-center gap-1.5 transition-colors">
                    <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                    إعادة ضبط
                </button>
                <button onclick="prevDhikr()" class="flex-1 bg-emerald-900/60 hover:bg-emerald-800 text-emerald-200 py-2.5 rounded-xl text-xs font-bold border border-emerald-700/50 flex items-center justify-center gap-1.5 transition-colors">
                    <i data-lucide="chevron-right" class="w-4 h-4"></i>
                    السابق
                </button>
                <button onclick="nextDhikr()" class="flex-1 bg-emerald-900/60 hover:bg-emerald-800 text-emerald-200 py-2.5 rounded-xl text-xs font-bold border border-emerald-700/50 flex items-center justify-center gap-1.5 transition-colors">
                    التالي
                    <i data-lucide="chevron-left" class="w-4 h-4"></i>
                </button>
            </div>

            <!-- Athkar Dynamic List -->
            <div class="w-full text-right mt-2">
                <h3 class="text-xs font-bold text-emerald-400 mb-2 px-1">قائمة الأذكار الرسمية والمضافة:</h3>
                <div id="dhikrList" class="space-y-2 max-h-40 overflow-y-auto pr-1">
                    <!-- Dynamic items rendered by JS -->
                </div>
            </div>

        </div>

        <!-- Add Dhikr Modal Overlay -->
        <div id="addModal" class="absolute inset-0 bg-black/70 backdrop-blur-sm hidden flex-col justify-end z-50">
            <div class="bg-emerald-900 border-t border-emerald-600 rounded-t-3xl p-6 space-y-4 shadow-2xl animate-slide-up">
                <div class="flex justify-between items-center border-b border-emerald-800 pb-3">
                    <h3 class="font-bold text-emerald-100 text-base flex items-center gap-2">
                        <i data-lucide="plus-circle" class="w-5 h-5 text-amber-400"></i>
                        إضافة ذكر جديد إلى القائمة
                    </h3>
                    <button onclick="closeAddModal()" class="text-emerald-400 hover:text-white">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>

                <div class="space-y-3">
                    <div>
                        <label class="block text-xs font-medium text-emerald-300 mb-1">نص الذكر / الدعاء:</label>
                        <textarea id="inputDhikrText" rows="2" placeholder="أدخل الذكر هنا..." class="w-full bg-emerald-950 border border-emerald-700 rounded-xl p-3 text-sm text-white placeholder-emerald-600 focus:outline-none focus:border-amber-400 resize-none"></textarea>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-medium text-emerald-300 mb-1">العدد المستهدف:</label>
                            <input id="inputTarget" type="number" min="1" value="33" class="w-full bg-emerald-950 border border-emerald-700 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-amber-400">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-emerald-300 mb-1">التصنيف:</label>
                            <select id="inputCategory" class="w-full bg-emerald-950 border border-emerald-700 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-amber-400">
                                <option value="morning">أذكار الصباح</option>
                                <option value="evening">أذكار المساء</option>
                                <option value="custom" selected>أذكاري المضافة</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="flex gap-2 pt-2">
                    <button onclick="saveNewDhikr()" class="flex-1 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-xl text-sm transition-colors shadow-md">
                        حفظ الذكر
                    </button>
                    <button onclick="closeAddModal()" class="px-4 bg-emerald-800 hover:bg-emerald-700 text-emerald-200 font-bold py-3 rounded-xl text-sm transition-colors">
                        إلغاء
                    </button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // Initial Data
        let athkar = [
            { id: 1, text: "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ ، سُبْحَانَ اللَّهِ الْعَظِيمِ", count: 0, target: 33, category: "morning" },
            { id: 2, text: "أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ", count: 0, target: 100, category: "morning" },
            { id: 3, text: "اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى نَبِيِّنَا مُحَمَّدٍ", count: 0, target: 10, category: "evening" },
            { id: 4, text: "لا حَوْلَ وَلا قُوَّةَ إِلاَّ بِاللَّهِ الْعَلِيِّ الْعَظِيمِ", count: 0, target: 33, category: "custom" }
        ];

        let currentIndex = 0;
        let activeFilter = 'all';

        const circleRadius = 96;
        const circumference = 2 * Math.PI * circleRadius;

        function init() {
            lucide.createIcons();
            renderActiveDhikr();
            renderList();
        }

        function getFilteredAthkar() {
            if (activeFilter === 'all') return athkar;
            return athkar.filter(item => item.category === activeFilter);
        }

        function renderActiveDhikr() {
            const filtered = getFilteredAthkar();
            if (filtered.length === 0) {
                document.getElementById('dhikrText').innerText = "لا توجد أذكار في هذا التصنيف، أضف ذكراً جديداً!";
                document.getElementById('countDisplay').innerText = "0";
                document.getElementById('targetDisplay').innerText = "المستهدف: 0";
                updateCircleProgress(0, 1);
                return;
            }

            if (currentIndex >= filtered.length) currentIndex = 0;

            const item = filtered[currentIndex];
            document.getElementById('dhikrText').innerText = item.text;
            document.getElementById('countDisplay').innerText = item.count;
            document.getElementById('targetDisplay').innerText = `المستهدف: ${item.target}`;
            
            const categoryNames = {
                morning: "أذكار الصباح",
                evening: "أذكار المساء",
                custom: "أذكاري المضافة"
            };
            document.getElementById('dhikrCategoryBadge').innerText = categoryNames[item.category] || "عام";

            updateCircleProgress(item.count, item.target);
        }

        function updateCircleProgress(count, target) {
            const circle = document.getElementById('progressCircle');
            const ratio = Math.min(count / target, 1);
            const offset = circumference - (ratio * circumference);
            circle.style.strokeDasharray = `${circumference}`;
            circle.style.strokeDashoffset = offset;
        }

        function incrementCount() {
            const filtered = getFilteredAthkar();
            if (filtered.length === 0) return;

            const item = filtered[currentIndex];
            if (item.count < item.target) {
                item.count++;
                renderActiveDhikr();
                renderList();
            }
        }

        function resetCurrentDhikr() {
            const filtered = getFilteredAthkar();
            if (filtered.length === 0) return;
            filtered[currentIndex].count = 0;
            renderActiveDhikr();
            renderList();
        }

        function nextDhikr() {
            const filtered = getFilteredAthkar();
            if (filtered.length === 0) return;
            currentIndex = (currentIndex + 1) % filtered.length;
            renderActiveDhikr();
            highlightListItem();
        }

        function prevDhikr() {
            const filtered = getFilteredAthkar();
            if (filtered.length === 0) return;
            currentIndex = (currentIndex - 1 + filtered.length) % filtered.length;
            renderActiveDhikr();
            highlightListItem();
        }

        function selectCategory(category) {
            activeFilter = category;
            currentIndex = 0;
            
            // Tab styling
            ['all', 'morning', 'evening', 'custom'].forEach(cat => {
                const tab = document.getElementById(`tab-${cat}`);
                if (cat === category) {
                    tab.className = "px-3 py-1.5 rounded-full font-bold transition-all bg-emerald-600 text-white whitespace-nowrap shadow-md";
                } else {
                    tab.className = "px-3 py-1.5 rounded-full font-bold transition-all bg-emerald-900/60 text-emerald-300 hover:bg-emerald-800 whitespace-nowrap";
                }
            });

            renderActiveDhikr();
            renderList();
        }

        function renderList() {
            const listContainer = document.getElementById('dhikrList');
            const filtered = getFilteredAthkar();
            
            listContainer.innerHTML = '';
            filtered.forEach((item, idx) => {
                const isActive = idx === currentIndex;
                const div = document.createElement('div');
                div.className = `p-2.5 rounded-xl border flex items-center justify-between text-xs cursor-pointer transition-all ${
                    isActive 
                    ? 'bg-emerald-800/80 border-amber-400 text-white shadow' 
                    : 'bg-emerald-950/60 border-emerald-800/50 text-emerald-200 hover:bg-emerald-900/40'
                }`;
                div.onclick = () => {
                    currentIndex = idx;
                    renderActiveDhikr();
                    renderList();
                };

                div.innerHTML = `
                    <div class="truncate max-w-[200px] font-medium">${item.text}</div>
                    <div class="flex items-center gap-2">
                        <span class="text-[11px] px-2 py-0.5 rounded-full bg-emerald-900 font-bold ${item.count >= item.target ? 'text-amber-400' : 'text-emerald-300'}">
                            ${item.count} / ${item.target}
                        </span>
                    </div>
                `;
                listContainer.appendChild(div);
            });
        }

        function highlightListItem() {
            renderList();
        }

        function openAddModal() {
            document.getElementById('addModal').classList.remove('hidden');
            document.getElementById('addModal').classList.add('flex');
        }

        function closeAddModal() {
            document.getElementById('addModal').classList.add('hidden');
            document.getElementById('addModal').classList.remove('flex');
            document.getElementById('inputDhikrText').value = '';
        }

        function saveNewDhikr() {
            const text = document.getElementById('inputDhikrText').value.trim();
            const target = parseInt(document.getElementById('inputTarget').value) || 33;
            const category = document.getElementById('inputCategory').value;

            if (!text) {
                alert('الرجاء كتابة نص الذكر');
                return;
            }

            const newDhikr = {
                id: Date.now(),
                text: text,
                count: 0,
                target: target,
                category: category
            };

            athkar.push(newDhikr);
            closeAddModal();
            
            // Switch to added dhikr's category or 'all'
            selectCategory(category);
            currentIndex = getFilteredAthkar().length - 1;
            renderActiveDhikr();
            renderList();
        }

        window.onload = init;
    </script>
</body>
</html>
